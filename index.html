const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct)));
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const pw=document.getElementById("p").value;
  try{await abrir(pw);try{if(document.getElementById("r")?.checked)localStorage.setItem("torre_pw",pw)}catch(_){}}
  catch(_){document.getElementById("err").textContent="Contraseña incorrecta."}});
(async()=>{let pw=null;try{pw=localStorage.getItem("torre_pw")}catch(_){} if(pw){try{await abrir(pw)}catch(_){try{localStorage.removeItem("torre_pw")}catch(__){}}}})();
